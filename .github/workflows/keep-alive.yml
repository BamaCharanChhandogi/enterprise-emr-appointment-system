name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Health Check Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          echo "Pinging backend at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://enterprise-emr-appointment-system-c108.onrender.com/api/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is healthy, alive and awake!"
          else
            echo "⚠️ Unexpected status code: $HTTP_STATUS"
          fi
